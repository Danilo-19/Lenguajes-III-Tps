<!DOCTYPE html>
<html lang="es">

<head>

</head>

<body>
    <h1 id="titulo-proyecto">Gestor de Tareas</h1>

    <div>Ingrese nombre de la tarea:</div>

    <form id="formulario-tarea">
        <select id="prioridad">
            <option id="baja">Baja</option>
            <option id="media">Media</option>
            <option id="alta">Alta</option>
        </select>
        <button type="button" id="btn-agregar">Agregar</button>
    </form>
<table id="tablaTareas" class="display">
    <thead>
        <tr>
            <th>Tarea</th>
            <th>Prioridad</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="script.js"></script>

</body>

</html>
